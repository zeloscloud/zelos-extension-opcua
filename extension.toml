name = "OPC-UA"
version = "0.1.5"
description = "Trace OPC UA servers, such as PLCs and gateways, by subscription or polling. Browsing finds every scalar variable, or a node map pins ids, units and scaling. Read, write and browse nodes, with optional signed and encrypted sessions and anonymous or X.509 user login."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-opcua"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["opcua", "opc-ua", "industrial", "plc", "scada", "automation", "opc ua", "opc.tcp", "iec 62541", "node id", "nodeid", "node map", "address space", "namespace", "subscription", "asyncua", "x.509", "certificate", "basic256sha256", "local discovery server"]
categories = ["Industrial", "IoT", "Protocol", "Networking"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["LICENSE", "main.py", "zelos_extension_opcua"]
