[project]
name = "zelos-extension-opcua"
version = "0.1.5"
description = "Trace OPC UA servers, such as PLCs and gateways, by subscription or polling. Browsing finds every scalar variable, or a node map pins ids, units and scaling. Read, write and browse nodes, with optional signed and encrypted sessions and anonymous or X.509 user login."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["zelos", "extension", "opcua", "opc-ua", "industrial", "plc", "scada"]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    # 1.x sends a ServerUri that .NET-stack and C++ SDK servers reject (BadServerUriInvalid)
    "asyncua>=2.0.1",
    "cryptography>=42.0.0",
    "rich-click>=1.8.0",
    # mDNS browse for auto_config
    "zeroconf>=0.136.0",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-opcua"
Repository = "https://github.com/zeloscloud/zelos-extension-opcua"
Issues = "https://github.com/zeloscloud/zelos-extension-opcua/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_opcua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"
asyncio_mode = "auto"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
